<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPANDA | Command Center</title>
    
    <!-- Load Leaflet.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* CSS: The Paint & Design */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* Dark stealth theme */
            color: #ffffff;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 { margin-top: 20px; font-weight: 300; letter-spacing: 2px; }

        /* The Map Container */
        #map {
            height: 60vh;
            width: 90%;
            margin: 20px auto;
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        /* The Emergency Alert Banner */
        #alert-banner {
            display: none;
            background-color: #ff0000;
            color: white;
            padding: 15px;
            width: 85%;
            margin: 0 auto;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
            animation: banner-blink 1s linear infinite; 
        }

        @keyframes banner-blink {
            50% { opacity: 0.3; }
        }

        /* CONTINUOUSLY BLINKING MAP DOT CSS */
        .blinking-dot {
            background-color: #ff0000;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #ffffff; /* White ring to make it pop */
            box-shadow: 0 0 10px rgba(255, 0, 0, 1);
            animation: dot-blink 0.6s infinite alternate; /* Fast blink effect */
        }

        @keyframes dot-blink {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.5); }
        }

        /* Developer Test Button */
        .test-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-bottom: 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }
        .test-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <h1>🌐 SPANDA TELEMETRY DASHBOARD</h1>
    
    <button class="test-btn" onclick="testEmergency()">Simulate Hardware Trigger</button>

    <div id="alert-banner">
        🚨 SOS TRIGGERED 🚨 <br>
        <span id="coords-text" style="font-size: 16px; font-weight: normal;">Locating...</span>
    </div>

    <div id="map"></div>

    <!-- Load Leaflet.js JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. Initialize the map (Default view over India)
        var map = L.map('map').setView([20.5937, 78.9629], 5);

        // 2. Load CartoDB Dark Matter tiles (Dark Stealth Theme)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors, © CARTO'
        }).addTo(map);

        var emergencyMarker;

        // 3. The Function to trigger the visual alert
        function triggerEmergency(lat, lng) {
            document.getElementById('alert-banner').style.display = 'block';
            document.getElementById('coords-text').innerText = "Live Location: " + lat + "° N, " + lng + "° E";
            
            map.flyTo([lat, lng], 16);

            if(emergencyMarker) { map.removeLayer(emergencyMarker); }
            
            // 4. Attach the blinking CSS class to a custom map icon
            var blinkingIcon = L.divIcon({
                className: 'blinking-dot',
                iconSize: [16, 16],
                iconAnchor: [8, 8], // Centers the dot exactly on the coordinates
                popupAnchor: [0, -10]
            });

            // 5. Drop the blinking marker on the map
            emergencyMarker = L.marker([lat, lng], {icon: blinkingIcon}).addTo(map)
                .bindPopup("<b>🎯 SPANDA Beacon Pinpointed!</b>").openPopup();
        }

        // Test Function (Simulates the SIM800L sending coordinates)
        function testEmergency() {
            triggerEmergency(30.3165, 78.0322);
        }
    </script>
</body>
</html>
