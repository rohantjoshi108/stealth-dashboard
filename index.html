<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEALTH | Command Center</title>
    
    <!-- Load Leaflet.js CSS (Free Map Library) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* CSS: The Paint & Design */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* Dark stealth theme */
            color: #ffffff;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 { margin-top: 20px; font-weight: 300; letter-spacing: 2px; }

        /* The Map Container */
        #map {
            height: 60vh;
            width: 90%;
            margin: 20px auto;
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        /* Custom Dark Mode Filter for standard free map tiles */
        .leaflet-tile {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        /* The Emergency Alert Banner */
        #alert-banner {
            display: none; /* Invisible until triggered */
            background-color: #ff0000;
            color: white;
            padding: 15px;
            width: 85%;
            margin: 0 auto;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
            animation: banner-blink 1s linear infinite; 
        }

        @keyframes banner-blink {
            50% { opacity: 0.3; }
        }

        /* CONTINUOUSLY BLINKING MAP DOT CSS */
        .blinking-dot {
            background-color: #ff0000;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #ffffff; /* White ring to make it pop */
            box-shadow: 0 0 10px rgba(255, 0, 0, 1);
            animation: dot-blink 0.6s infinite alternate; /* Fast blink effect */
            margin: 0;
            padding: 0;
            display: block;
        }

        @keyframes dot-blink {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.5); }
        }

        /* Developer Test Button */
        .test-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-bottom: 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }
        .test-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <!-- Updated Title -->
    <h1>🌐 STEALTH TELEMETRY DASHBOARD</h1>
    
    <button class="test-btn" onclick="testEmergency()">Simulate Hardware Trigger</button>

    <div id="alert-banner">
        🚨 SOS TRIGGERED 🚨 <br>
        <span id="coords-text" style="font-size: 16px; font-weight: normal;">Locating...</span>
    </div>

    <div id="map"></div>

    <!-- Load Leaflet.js JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // JavaScript: The Muscle & Logic

        // 1. Initialize the map (Default view over India)
        var map = L.map('map').setView([20.5937, 78.9629], 5);

        // 2. Load standard OpenStreetMap tiles (Safe, free, no API keys)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var emergencyMarker;

        // 3. The Function to trigger the visual alert
        function triggerEmergency(lat, lng) {
            // Show the blinking red banner
            document.getElementById('alert-banner').style.display = 'block';
            
            // Update the text with actual coordinates
            document.getElementById('coords-text').innerText = "Live Location: " + lat + "° N, " + lng + "° E";

            // Fly the map to the specific coordinates
            map.flyTo([lat, lng], 16);

            // Remove old marker if it exists
            if(emergencyMarker) { map.removeLayer(emergencyMarker); }
            
            // Create the completely aligned blinking icon
            var blinkingIcon = L.divIcon({
                className: '', // Leave empty to prevent Leaflet from adding a white background
                html: '<div class="blinking-dot"></div>',
                iconSize: [16, 16],
                iconAnchor: [8, 8], // Perfectly centers the 16px dot on the exact lat/long
                popupAnchor: [0, -10] // Hovers the popup exactly above the dot
            });

            // Drop the marker and update the popup text to STEALTH
            emergencyMarker = L.marker([lat, lng], {icon: blinkingIcon}).addTo(map)
                .bindPopup("<b>🎯 STEALTH Beacon Pinpointed!</b>").openPopup();
        }

        // 4. Test Function (Simulates the SIM800L sending coordinates)
        function testEmergency() {
            // Triggering coordinates for Dehradun
            triggerEmergency(30.3165, 78.0322);
        }
    </script>
</body>
</html>
